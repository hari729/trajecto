[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trajecto"
version = "0.1.0"
description = "Multi-objective trajectory optimization for robot manipulators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.3",
    "loares>=2.3.0",
    "pin>=4.1.0",
    "pymoo>=0.6.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
include = ["src"]
exclude = [
    "**/build",
    "**/install",
    "**/log",
    "**/__pycache__",
]
# ROS 2 Python packages are apt-installed under /opt/ros (inside the
# container); locally they come from your own ROS installation.
extraPaths = ["/opt/ros/jazzy/lib/python3.12/site-packages"]
typeCheckingMode = "basic"
reportPrivateImportUsage = false
reportUnusedCallResult = false
pythonVersion = "3.12"
pythonPlatform = "Linux"
